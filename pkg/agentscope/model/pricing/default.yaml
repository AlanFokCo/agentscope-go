# Price overlay (HARNESS_DESIGN D1). Deliberately NOT part of the upstream
# model-card sync: cards come from the Python repo without prices and a
# resync must never clobber cost data. USD per 1M tokens.
# as_of dates the last manual refresh; staleness is documented, and
# SetPrice overrides always win for callers that know better.
as_of: "2026-09-01"
models:
  # OpenAI
  gpt-4o:            {input: 2.50,  output: 10.00}
  gpt-4o-mini:       {input: 0.15,  output: 0.60}
  gpt-4.1:           {input: 2.00,  output: 8.00}
  gpt-4.1-mini:      {input: 0.40,  output: 1.60}
  gpt-5.5:           {input: 5.00,  output: 15.00}
  # Anthropic
  claude-sonnet-4-5: {input: 3.00,  output: 15.00, cache_read: 0.30, cache_write: 3.75}
  claude-opus-4-5:   {input: 15.00, output: 75.00, cache_read: 1.50, cache_write: 18.75}
  claude-haiku-4-5:  {input: 1.00,  output: 5.00,  cache_read: 0.10, cache_write: 1.25}
  # DashScope (qwen)
  qwen-plus:         {input: 0.40,  output: 1.20}
  qwen3.7-max:       {input: 1.20,  output: 6.00}
  qwen-flash:        {input: 0.05,  output: 0.20}
  # Moonshot
  kimi-k2.6:         {input: 0.60,  output: 2.50}
  # DeepSeek
  deepseek-chat:     {input: 0.27,  output: 1.10, cache_read: 0.07}
  # xAI
  grok-3:            {input: 3.00,  output: 15.00}
