version: "2"

run:
  timeout: 5m

formatters:
  enable:
    - gofmt

linters:
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - gocritic
    - misspell
  settings:
    errcheck:
      check-blank: false
      exclude-functions:
        - (io.Closer).Close
        - (*os/exec.Cmd).Run
        - (net/http.ResponseWriter).Write
        - fmt.Fprint
        - fmt.Fprintf
        - fmt.Fprintln
    gocritic:
      enabled-tags:
        - diagnostic
        - performance
      disabled-checks:
        - ifElseChain
    misspell:
      locale: US
    staticcheck:
      checks:
        - "all"
        - "-QF*"
        - "-ST*"
  exclusions:
    rules:
      - path: pkg/agentscope/event/
        linters: [gocritic]
        text: hugeParam
      - path: pkg/agentscope/message/
        linters: [gocritic]
        text: hugeParam
      - path: examples/
        linters: [errcheck, staticcheck]
      - path: _test\.go
        linters: [errcheck]
    paths:
      - vendor

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
