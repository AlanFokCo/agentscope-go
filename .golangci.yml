run:
  timeout: 5m

linters:
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - gosimple
    - gocritic
    - misspell
    - gofmt

linters-settings:
  errcheck:
    check-blank: false
  gocritic:
    enabled-tags:
      - diagnostic
      - performance
    disabled-checks:
      - ifElseChain
  misspell:
    locale: US

issues:
  exclude-dirs:
    - vendor
  exclude-rules:
    # Event types implement the Event interface via value receivers;
    # pointer receivers would break interface satisfaction.
    - path: pkg/agentscope/event/
      linters: [gocritic]
      text: hugeParam
    # ToolCallBlock and ToolResultBlock implement ContentBlock interface
    # via value receivers; cannot change to pointer receivers.
    - path: pkg/agentscope/message/
      linters: [gocritic]
      text: hugeParam
  max-issues-per-linter: 0
  max-same-issues: 0
